services:
  game:
    build:
      context: .
      dockerfile: Dockerfile
    image: peculiar-house:latest
    container_name: peculiar-house
    ports:
      # Open http://localhost:8088 once this is up.
      # Override with PECULIAR_PORT=9000 docker compose up if 8088 is taken.
      - '${PECULIAR_PORT:-8088}:80'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost/healthz']
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
