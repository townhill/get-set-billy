<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="The Peculiar House - an original single-screen platform game in the spirit of the early 1980s British home computer."
    />
    <meta name="theme-color" content="#000000" />
    <title>The Peculiar House</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: monospace;
      }

      #game {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
      }

      /* No smoothing anywhere. These are meant to be square. */
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
      }

      #loading {
        position: absolute;
        color: #40e8ff;
        font-size: 14px;
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <div id="game"><p id="loading">LOADING THE PECULIAR HOUSE...</p></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
